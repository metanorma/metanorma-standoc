<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny" width="220" height="160" viewBox="0 0 220 160">
  <title>opacity and clip-rule on g</title>
  <desc>Drawing exports carry opacity and clip-rule presentation attributes on container elements (claricle/svg_conform#130)</desc>
  <defs>
    <clipPath id="presentation_clip_path" clipPathUnits="userSpaceOnUse">
      <path clip-rule="evenodd" d="M0,0 L220,0 L220,160 L0,160 Z M20,20 L60,20 L60,60 L20,60 Z"/>
    </clipPath>
  </defs>
  <g class="Slide" opacity="0.85" clip-rule="evenodd" clip-path="url(#presentation_clip_path)">
    <rect x="20" y="20" width="80" height="50" fill="#ff0000"/>
    <circle cx="160" cy="110" r="30" fill="#0000ff"/>
  </g>
</svg>
