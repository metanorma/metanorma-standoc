# Table cell grid (metanorma-standoc#1381). Validate#table_validate runs the
# column and row checks once for tables with a colgroup and again, with the
# widest-row column count, for tables with spans; each is its own rule, so a
# table matching both is reported by both, as the legacy method does.
# STANDOC_5: cell ends past the column count.
  - id: standoc.table.column-overflow.colgroup
    code: STANDOC_5
    mode: shadow
    context: "//table[colgroup][not(ancestor::metanorma-extension)]"
    check: cell_grid
    args: {report: column_overflow, columns: colgroup}
    params: [{value: columns}]
  - id: standoc.table.column-overflow.spans
    code: STANDOC_5
    mode: shadow
    context: "//table[.//*[@colspan] | .//*[@rowspan]][not(ancestor::metanorma-extension)]"
    check: cell_grid
    args: {report: column_overflow, columns: row_cells}
    params: [{value: columns}]
# STANDOC_4: rows of unequal width.
  - id: standoc.table.rows-inconsistent.colgroup
    code: STANDOC_4
    mode: shadow
    context: "//table[colgroup][not(ancestor::metanorma-extension)]"
    check: cell_grid
    args: {report: row_mismatch}
    params: [are inconsistent]
  - id: standoc.table.rows-inconsistent.spans
    code: STANDOC_4
    mode: shadow
    context: "//table[.//*[@colspan] | .//*[@rowspan]][not(ancestor::metanorma-extension)]"
    check: cell_grid
    args: {report: row_mismatch}
    params: [are inconsistent]
  - id: standoc.table.rowspan-outside-thead
    code: STANDOC_4
    mode: shadow
    context: "//table[.//*[@rowspan]][not(ancestor::metanorma-extension)]"
    check: cell_grid
    args: {report: row_mismatch, section: thead}
    params: [cannot go outside thead]
  - id: standoc.table.rowspan-outside-tbody
    code: STANDOC_4
    mode: shadow
    context: "//table[.//*[@rowspan]][not(ancestor::metanorma-extension)]"
    check: cell_grid
    args: {report: row_mismatch, section: tbody}
    params: [cannot go outside tbody]
  - id: standoc.table.rowspan-outside-tfoot
    code: STANDOC_4
    mode: shadow
    context: "//table[.//*[@rowspan]][not(ancestor::metanorma-extension)]"
    check: cell_grid
    args: {report: row_mismatch, section: tfoot}
    params: [cannot go outside tfoot]

# Term state (metanorma-standoc#1381).
# Validate#preferred_validate (STANDOC_24): the same preferred designation,
# with its <domain> prefix, on more than one term.
  - id: standoc.term.preferred-duplicate
    code: STANDOC_24
    mode: shadow
    context: /*
    check: duplicate_designation
    args: {terms: //term, designation: ./preferred//name, prefix: ./domain}
    params: [{value: designation}, {value: locations}]
# Validate#termsect_validate (STANDOC_25): designation markup in a clause
# that is not a terms clause.
  - id: standoc.term.designation-outside-terms
    code: STANDOC_25
    mode: shadow
    context: /*
    check: designation_outside_terms
    args:
      designations: //preferred | //admitted | //deprecates
      containers: [foreword, introduction, acknowledgements, executivesummary,
                   abstract, clause, references, terms, definitions, annex,
                   appendix, indexsect]
    params: [{value: designations}]

# Document state, file system and validator options (metanorma-standoc#1381).
# Term#concept_validate (STANDOC_23): a concept or related-concept
# cross-reference that does not point to a term or symbol. The message is
# built from the document, as in the legacy method (which ends it with a
# newline unless it carries the subterm hint).
  - id: standoc.concept.xref-not-term
    code: STANDOC_23
    mode: shadow
    context: //concept/xref
    check: concept_reference
    args:
      known: //term/@anchor | //definitions//dt/@anchor
      subterm: //terms/@anchor
      label: Concept
      refterm: ../refterm
    params: [{value: message}]
  - id: standoc.related.xref-not-term
    code: STANDOC_23
    mode: shadow
    context: //related/xref
    check: concept_reference
    args:
      known: //term/@anchor | //definitions//dt/@anchor
      subterm: //terms/@anchor
      label: Related
      refterm: ../preferred//name
    params: [{value: message}]
# Image#image_exists (STANDOC_44) and Image#image_toobig (STANDOC_46).
  - id: standoc.image.file-missing
    code: STANDOC_44
    mode: shadow
    context: //image[@src] | //altmedia[@src]
    check: file_missing
    params: [{value: src}]
  - id: standoc.image.too-large
    code: STANDOC_46
    mode: shadow
    context: //image[@src]
    check: value_too_long
    args: {attribute: src, limit: dataurimaxsize}
# Validate#repeat_id_validate (STANDOC_36): an @id, or an @anchor of an
# element with an @id, that an earlier element already holds.
  - id: standoc.id.repeated
    code: STANDOC_36
    mode: shadow
    context: /*
    check: duplicate_value
    args: {nodes: "//*[@id]", attribute: id}
    params: [{value: value}, {value: line}]
  - id: standoc.anchor.repeated
    code: STANDOC_36
    mode: shadow
    context: /*
    check: duplicate_value
    args: {nodes: "//*[@id][@anchor]", attribute: anchor}
    params: [{value: value}, {value: line}]
